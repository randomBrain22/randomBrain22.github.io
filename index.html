{id:"plitvice",lat:44.8654,lon:15.582,name:"Plitvice Lakes National Park",country:"Croatia",region:"Central Croatia",type:"natural wonder · national park",tags:["Nature"],short:"The waterfalls are built by living organisms: mosses, algae and bacteria slowly turn dissolved limestone into new rock.",intro:"Plitvice is often photographed as a finished landscape, but it is better understood as a place still being made. Sixteen named lakes spill into one another across a forested karst basin, their edges held by delicate natural dams called tufa barriers.",story:"The unusual detail is that the waterfalls are partly biological architecture. Microscopic algae and bacteria help calcium carbonate crystallise; aquatic mosses then trap and bind the mineral, gradually building porous rock. The park’s own researchers identify the moss Palustriella commutata as an important builder. The barriers grow, erode and redirect water, so the map of the lakes is never completely fixed. Even the brilliant colours are not simply a reflection of the sky: depth, minerals, organisms and light all contribute.",facts:["The park’s tufa barriers are active formations, not ancient stone structures frozen in time.","Mosses can become preserved inside the growing limestone, leaving their shapes behind.","The park protects the wider water catchment because the underground system helps sustain the lakes.","Plitvice became Croatia’s first national park in 1949."],images:[["waterfalls at Plitvice Lakes","https://commons.wikimedia.org/wiki/Special:FilePath/Waterfalls%20at%20Plitvice%20Lakes.jpg?width=1400","https://commons.wikimedia.org/wiki/File:Waterfalls_at_Plitvice_Lakes.jpg"],["lake and waterfalls","https://commons.wikimedia.org/wiki/Special:FilePath/Lake%20with%20a%20row%20of%20waterfalls%2C%20Plitvice%20Lakes%20%28IMG%205311%29.jpg?width=1000","https://commons.wikimedia.org/wiki/File:Lake_with_a_row_of_waterfalls,_Plitvice_Lakes_(IMG_5311).jpg"]],sources:[["unesco world heritage","https://whc.unesco.org/en/list/98/"],["how tufa is formed · Plitvice park","https://np-plitvicka-jezera.hr/en/natural-and-cultural-heritage/natural-heritage/tufa/how-tufa-is-formed/"]],map:"https://www.google.com/maps/search/?api=1&query=Plitvice+Lakes+National+Park+Croatia"},
{id:"ama",lat:36.092,lon:133.03,name:"Ama Town (海士町)",country:"Japan",region:"Nakanoshima · Oki Islands · Shimane",type:"island town · geology · history",tags:["Islands","Culture"],short:"A farming island inside the collapsed heart of an ancient volcano, where imperial exile, rice fields and red cliffs share the same small landscape.",intro:"",story:"",introHeading:"the story behind the place",storyHeading:"what makes it unusual",introPoints:["Nakanoshima is one of the Dōzen islands in the Oki archipelago.","Its unusually broad flatlands made rice farming possible — rare in this island group.","The coastline is volcanic, with red cliffs and sheltered coves."],storyPoints:["The Dōzen islands form the exposed rim of a vast volcanic caldera; its centre collapsed and later filled with seawater.","Akiya Coast’s red cliffs get their colour from oxidised volcanic scoria.","After the Jōkyū disturbance of 1221, retired Emperor Go-Toba was exiled to Nakanoshima. He lived here for 19 years.","Some of Go-Toba’s ashes were returned to Kyoto; others remain buried on the island.","At the Kinnyamonya Festival, dancers carry a wooden rice scoop in each hand."],facts:["Nakanoshima is the only island in the Dōzen group with enough flatland for substantial rice cultivation.","Akiya Coast’s red cliffs are made from volcanic scoria, deposits of hardened magma coloured by exposure to air.","The Dōzen islands are the rim of a submerged volcanic caldera.","Emperor Go-Toba’s burial site and Oki Shrine are both in Ama Town."],images:[["Akiya Coast, Nakanoshima","https://commons.wikimedia.org/wiki/Special:FilePath/Nakanoshima%20Akiya%20coast.jpg?width=1400","https://commons.wikimedia.org/wiki/File:Nakanoshima_Akiya_coast.jpg"],["Saburo Rocks, Ama","https://commons.wikimedia.org/wiki/Special:FilePath/Ama%20town%20Saburo%20Rocks%20ac.jpg?width=1000","https://commons.wikimedia.org/wiki/Category:Akiya_Coast"]],sources:[["Oki Islands official guide · Ama","https://visit-okiislands.e-oki.net/about/ama/"],["Japan tourism agency · Nakanoshima","https://www.mlit.go.jp/tagengo-db/common/001563181.pdf"],["Akiya Coast guide","https://visit-okiislands.e-oki.net/spots/6066/"]],map:"https://www.google.com/maps/search/?api=1&query=Ama+Town+Nakanoshima+Oki+Islands+Japan"},
{id:"tiantishan",lat:37.47,lon:102.18,name:"Tiantishan Grottoes (天梯山石窟)",country:"China",region:"Wuwei · Gansu",type:"ancient site · Buddhist art",tags:["Culture"],short:"A fifth-century cave temple that helped shape Buddhist art across China — and whose treasures were split apart by a modern reservoir project.",intro:"Carved into cliffs near Wuwei in Gansu, the Tiantishan Grottoes began under the Northern Liang ruler Juqu Mengxun around 412–439 CE. The site is sometimes called a source of early Chinese cave-temple design because its forms and workshop traditions travelled far beyond this valley.",story:"The caves are more than a collection of statues: they preserve clues to how Buddhist art moved along the Hexi Corridor. The style associated with the site, sometimes called the Liangzhou model, influenced later cave temples including Yungang and Longmen. In 1959–60, construction of the Huangyang River reservoir put parts of the complex at risk. Many sculptures and more than 300 square metres of murals were removed for protection; the monumental Buddha in Cave 13 was too large to move and remained on site. A long conservation effort later repaired and returned many of the displaced works. Some murals were found layered over earlier paintings, revealing centuries of redecoration beneath the visible surface.",facts:["The caves were founded under the Northern Liang ruler Juqu Mengxun in the early fifth century.","The site is regarded as an important origin point for the Liangzhou model of cave-temple art.","Reservoir construction in 1959–60 led to the removal of many murals and sculptures.","A major restoration project repaired more than 300 square metres of murals and over 70 sculptures."],images:[["Tiantishan Grottoes","https://commons.wikimedia.org/wiki/Special:FilePath/Tiantishan%20Grottoes%202015.jpg?width=1400","https://commons.wikimedia.org/wiki/File:Tiantishan_Grottoes_2015.jpg"],["Buddha of Tiantishan","https://commons.wikimedia.org/wiki/Special:FilePath/Tiantishan%20Grotto%20Budda.jpg?width=1000","https://commons.wikimedia.org/wiki/File:Tiantishan_Grotto_Budda.jpg"]],sources:[["Gansu cultural heritage · history and conservation","https://www.gswbj.gov.cn/a/2023/03/27/16793.html"],["China ethnic affairs commission · Northern Liang murals","https://www.neac.gov.cn/seac/c103391/202301/1159968.shtml"]],map:"https://www.google.com/maps/search/?api=1&query=Tiantishan+Grottoes+Wuwei+Gansu+China"},
{id:"debo",lat:15.1,lon:-4.1,name:"Lake Débo (Lac Débo)",country:"Mali",region:"Inner Niger Delta",type:"seasonal lake · wetland · wildlife",tags:["Nature"],short:"A lake that swells and retreats with a flood pulse travelling hundreds of kilometres from rainstorms far upstream.",intro:"Lake Débo lies in the Inner Niger Delta, where the Niger River spreads into a shifting maze of channels, lakes and marshes in central Mali. In this dry part of the Sahel, the delta behaves less like a permanent lake district and more like a vast seasonal breathing system.",story:"The flood does not arrive all at once. Rain falling months earlier in the Niger’s distant headwaters becomes a slow-moving wave that travels downstream. It typically reaches the Lake Débo area around November and December, after passing through the delta’s broad floodplain. During the wet season, water spreads across enormous areas; during the dry season, much of that wetland contracts or dries out. This pulse creates a moving calendar for fish, waterbirds, rice growers and herders. The delta can be mostly dry for nearly half the year, yet when flooded it becomes one of the Sahel’s most productive wetland ecosystems.",facts:["The flood peak at Lake Débo typically arrives in November–December, later than the rains that generated it.","The wider Inner Niger Delta can expand to tens of thousands of square kilometres during high water and shrink dramatically in the dry season.","Flood timing and height depend on rainfall far upstream, not just local weather around the lake.","satellite imagery shows the delta turning intensely green during the annual flood season."],images:[["Lake Débo from space","https://commons.wikimedia.org/wiki/Special:FilePath/ISS-66%20Niger%20River%20leads%20to%20Lake%20Deebo%2C%20Mali.jpg?width=1400","https://commons.wikimedia.org/wiki/Category:Lake_D%C3%A9bo"],["Lake Débo, Landsat view","https://commons.wikimedia.org/wiki/Special:FilePath/Lake%20debo%20mali%20-%20Landsat8%20December%202013.jpg?width=1000","https://commons.wikimedia.org/wiki/Category:Lake_D%C3%A9bo"]],sources:[["nasa earth observatory · seasonal emerald","https://science.nasa.gov/earth/earth-observatory/a-seasonal-emerald-in-the-sahel-149117/"],["freshwater ecoregions · Inner Niger Delta","https://www.feow.org/ecoregions/details/508"]],map:"https://www.google.com/maps/search/?api=1&query=Lake+Debo+Mali"},
{id:"nosy-boraha",lat:-16.9167,lon:49.9,name:"Nosy Boraha (Île Sainte-Marie)",country:"Madagascar",region:"Analanjirofo · Indian Ocean",type:"island · maritime history · marine life",tags:["Islands","Nature","History"],short:"A long island off Madagascar’s east coast, once a refuge for Indian Ocean pirates and now a seasonal gathering place for migrating humpback whales.",intro:"Nosy Boraha — also known as Île Sainte-Marie — lies just off Madagascar’s eastern coast. Around 60 kilometres long and narrow in shape, it is edged by reefs, sheltered channels and smaller islands, including Île aux Nattes at its southern tip.",story:"Its geography shaped an extraordinary maritime past. In the late 17th and 18th centuries, sheltered bays made the island a well-known base for pirates sailing the Indian Ocean. The old cemetery near Ambodifotatra and nearby Île aux Forbans are reminders of that era. The surrounding waters have another seasonal story: humpback whales migrate here from Antarctic feeding grounds to breed and give birth, gathering around Sainte-Marie and Antongil Bay during the southern winter, especially from July to September.",introHeading:"the story behind the place",storyHeading:"what makes it unusual",introPoints:["Nosy Boraha, also called Île Sainte-Marie, sits just off Madagascar’s east coast in the Indian Ocean.","The island is long and narrow — roughly 60 km from end to end — with reefs and a shallow channel separating it from the mainland.","Île aux Nattes, a smaller island, lies just off its southern tip."],storyPoints:["In the late 17th and 18th centuries, sheltered bays made Sainte-Marie a prominent refuge and base for Indian Ocean pirates.","The pirate cemetery near Ambodifotatra and Île aux Forbans preserve traces of this maritime history.","Humpback whales migrate from Antarctic waters to the region to breed and calve, with the main season around July–September.","A barrier reef surrounds much of the island, helping form a shallow lagoon along parts of the coast.","The island’s waters are part of an important marine-mammal area that includes Antongil Bay and the Sainte-Marie Channel."],facts:["The island is about 60 km long and less than 10 km wide.","Its Malagasy name is Nosy Boraha; Île Sainte-Marie is the French name.","The whale season is generally July to September.","Ambodifotatra is the island’s main town."],images:[["pirate cemetery on Sainte-Marie","https://medias.elloha.com/crop-750x560/717b71fe-1e7f-4416-a5b6-ab616a1c15d9/cimeti%C3%A8re-des-pirates-ile-ste-marie-madagascar-01.jpg","https://borahacom.ellohaweb.com/en-GB/presentation/saint-marie-island.html"],["lagoon and island coastline","https://images.trvl-media.com/place/3222/942fbda4-10d1-4a86-ad46-e275a6b1bcbf.jpg","https://www.expedia.com/Nosy-Boraha.dx3222"]],sources:[["madagascar national tourism office · Sainte-Marie","https://madagascar-tourisme.com/fr/destination/sainte-marie/"],["marine mammal habitat · Madagascar central east coast","https://www.marinemammalhabitat.org/wp-content/uploads/imma-factsheets/WesternIndianOcean/Madagascar-central-east-coast-WesternIndianOcean.pdf"],["Sainte-Marie tourism · pirate history","https://saintemarie-tourisme.com/wp-content/uploads/2023/06/LA-GAZETTE-DE-SAINTE-MARIE-Edition-ITM.pdf"]],map:"https://www.google.com/maps/search/?api=1&query=Nosy+Boraha+Ile+Sainte+Marie+Madagascar"}
];
const listing=document.getElementById("listing"),detail=document.getElementById("detail"),detailbody=document.getElementById("detailbody");
const canvas=document.getElementById("globe"),ctx=canvas.getContext("2d"),tip=document.querySelector(".globe-tip");
let centerLon=55,centerLat=27,zoom=1,world=null,countries=null,borders=null,coastline=null,projection=null,path=null,pins=[],size={w:0,h:0,dpr:1},globeFramePending=0;
const pointers=new Map();let previousPinch=null,gestureMoved=false,gestureStart=null;
function setupProjection(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(window.devicePixelRatio||1,1.25);if(w!==size.w||h!==size.h||dpr!==size.dpr){size={w,h,dpr};canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);projection=d3.geoOrthographic().clipAngle(90).precision(.65).translate([w/2,h/2]).scale(Math.min(w*.43,h*.47)*zoom).rotate([-centerLon,-centerLat,0]);path=d3.geoPath(projection,ctx)}
function drawGlobeFrame(){
 setupProjection();const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);
 if(!world){ctx.fillStyle="#315f70";ctx.fillRect(0,0,w,h);return}
 const sphere={type:"Sphere"},graticule=d3.geoGraticule10();
 const R=projection.scale(),cx=w/2,cy=h/2;
 ctx.save();ctx.beginPath();path(sphere);const ocean=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.05,cx,cy,R*1.25);ocean.addColorStop(0,"#a9dce4");ocean.addColorStop(.58,"#579eaf");ocean.addColorStop(1,"#214e63");ctx.fillStyle=ocean;ctx.fill();
 if(countries){ctx.beginPath();path(countries);ctx.fillStyle="#a9c99a";ctx.fill();ctx.strokeStyle="rgba(238,246,218,.55)";ctx.lineWidth=.35;ctx.stroke()}
 if(borders){ctx.beginPath();path(borders);ctx.strokeStyle="rgba(245,250,231,.75)";ctx.lineWidth=.65;ctx.stroke()}
 if(coastline){ctx.beginPath();path(coastline);ctx.strokeStyle="rgba(31,77,65,.8)";ctx.lineWidth=.8;ctx.stroke()}
 ctx.beginPath();path(graticule);ctx.strokeStyle="rgba(229,248,242,.22)";ctx.lineWidth=.55;ctx.stroke();
 ctx.restore();
 ctx.beginPath();path(sphere);ctx.strokeStyle="rgba(239,255,243,.72)";ctx.lineWidth=1.2;ctx.stroke();
 pins=[];P.forEach(p=>{const pos=projection([p.lon,p.lat]);if(!pos||d3.geoDistance([p.lon,p.lat],[centerLon,centerLat])>Math.PI/2)return;const [x,y]=pos;pins.push({p,x,y});ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fillStyle="rgba(213,255,145,.22)";ctx.fill();ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fillStyle="#eaff9c";ctx.fill();ctx.strokeStyle="#244d42";ctx.lineWidth=1.4;ctx.stroke()});
}
function drawGlobe(){if(globeFramePending)return;globeFramePending=requestAnimationFrame(()=>{globeFramePending=0;drawGlobeFrame()})}
async function loadWorld(){try{tip.textContent="loading detailed country borders…";let libError;for(const base of ["https://esm.sh/","https://cdn.jsdelivr.net/npm/"]){try{const suffix=base.includes("esm.sh")?"?bundle":"+esm";const [geo,topo]=await Promise.all([import(base+"d3-geo@3"+suffix),import(base+"topojson-client@3"+suffix)]);d3=geo;topojson=topo;break}catch(error){libError=error}}if(!d3||!d3.geoOrthographic||!topojson||!topojson.feature)throw new Error("map libraries unavailable: "+(libError&&libError.message||"missing required functions"));let dataError;for(const url of ["https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json","https://unpkg.com/world-atlas@2/countries-10m.json"]){try{const response=await fetch(url,{mode:"cors",cache:"force-cache"});if(!response.ok)throw new Error("country data request returned HTTP "+response.status);world=await response.json();break}catch(error){dataError=error}}if(!world)throw new Error("could not download country data: "+(dataError&&dataError.message||"unknown network error"));if(!world.objects||!world.objects.countries)throw new Error("country data arrived in an unexpected format");countries=topojson.feature(world,world.objects.countries);borders=topojson.mesh(world,world.objects.countries,(a,b)=>a!==b);coastline=topojson.mesh(world,world.objects.countries,(a,b)=>a===b);tip.textContent="drag to rotate · pinch to zoom · tap a glowing point";drawGlobe()}catch(error){tip.textContent="map error: "+(error.message||"unknown error")+". saved locations are still available below.";console.error("globe map loading failed:",error)}}
function renderGlobePlaces(){document.getElementById("globePlaces").innerHTML=P.map(p=>'<button class="globe-place" data-place="'+p.id+'"><span></span>'+p.name+' <small>'+p.country+'</small></button>').join("")}
function showFromGlobe(id){showPlace(id)}
function pointDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function pointerDown(e){canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,prevX:e.clientX,prevY:e.clientY});if(pointers.size===1){gestureMoved=false;gestureStart={x:e.clientX,y:e.clientY};previousPinch=null}else if(pointers.size===2){gestureMoved=true;const a=[...pointers.values()];previousPinch=pointDistance(a[0],a[1])}}
function pointerMove(e){if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;if(pointers.size>=2){const a=[...pointers.values()],dist=pointDistance(a[0],a[1]);if(previousPinch&&dist>0){zoom=Math.max(.85,Math.min(9,zoom*dist/previousPinch));drawGlobe()}previousPinch=dist;gestureMoved=true}else{const dx=e.clientX-p.prevX,dy=e.clientY-p.prevY;if(Math.abs(e.clientX-gestureStart.x)+Math.abs(e.clientY-gestureStart.y)>4)gestureMoved=true;const scale=projection?projection.scale():250;centerLon-=dx/scale*57.2958;centerLat+=dy/scale*57.2958;centerLat=Math.max(-89,Math.min(89,centerLat));drawGlobe()}p.prevX=e.clientX;p.prevY=e.clientY}
function pointerUp(e){const p=pointers.get(e.pointerId);if(!p)return;const wasSingle=pointers.size===1;const start=gestureStart;pointers.delete(e.pointerId);previousPinch=null;if(wasSingle&&!gestureMoved&&start){const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let hit=null,dist=24;pins.forEach(pin=>{const d=Math.hypot(pin.x-x,pin.y-y);if(d<dist){dist=d;hit=pin}});if(hit)showFromGlobe(hit.p.id)}if(pointers.size===0)gestureStart=null}
canvas.addEventListener("pointerdown",pointerDown);canvas.addEventListener("pointermove",pointerMove);canvas.addEventListener("pointerup",pointerUp);canvas.addEventListener("pointercancel",pointerUp);
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.85,Math.min(9,zoom*Math.exp(-e.deltaY*.001)));drawGlobe()},{passive:false});
document.getElementById("zoomIn").addEventListener("click",()=>{zoom=Math.min(9,zoom*1.25);drawGlobe()});
document.getElementById("zoomOut").addEventListener("click",()=>{zoom=Math.max(.85,zoom/1.25);drawGlobe()});
document.getElementById("resetGlobe").addEventListener("click",()=>{centerLon=55;centerLat=27;zoom=1;drawGlobe()});
document.getElementById("globePlaces").addEventListener("click",e=>{const b=e.target.closest("[data-place]");if(b)showFromGlobe(b.dataset.place)});
window.addEventListener("resize",drawGlobe);
renderGlobePlaces();loadWorld();
function renderDaily(){
 const day=new Date();const key=day.getFullYear()*10000+(day.getMonth()+1)*100+day.getDate();
 const p=P[key%P.length];
 const image=p.images&&p.images[0]?p.images[0][1]:"";
 document.getElementById("daily").innerHTML='<div class="daily-copy"><div class="eyebrow">location of the day</div><h1>'+p.name+'</h1><p>'+p.short+'</p><div class="daily-meta">'+p.region+' · '+p.country+'</div><a class="daily-link" href="#'+p.id+'" data-daily="'+p.id+'">discover this place <span>→</span></a></div><div class="daily-image"><img src="'+image+'" alt="'+p.name+'" loading="eager"></div>';
}
function renderCollection(){
 const grid=document.getElementById("placeGrid");
 const shuffled=[...P];
 for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}
 grid.innerHTML=shuffled.map(p=>'<article class="card" role="button" tabindex="0" data-place="'+p.id+'"><div class="cover"><img src="'+(p.images&&p.images[0]?p.images[0][1]:"")+'" alt="'+p.name+'" loading="lazy"></div><div class="cardbody"><div class="placecountry">'+p.region+' · '+p.country+'</div><h3>'+p.name+'</h3><p>'+p.short+'</p><div class="cardfoot"><span>'+p.type+'</span><span class="arrow">→</span></div></div></article>').join("");
 grid.addEventListener("click",e=>{const card=e.target.closest("[data-place]");if(card)showPlace(card.dataset.place)});
 grid.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-place]")){e.preventDefault();showPlace(e.target.dataset.place)}});
}
function detailHTML(p){const section=(text,points)=>points?'<ul class="storypoints">'+points.map(x=>'<li>'+x+'</li>').join("")+'</ul>':'<p>'+text+'</p>';return '<div class="detailhead"><div><div class="eyebrow">'+p.region+' · '+p.country+'</div><h1>'+p.name+'</h1></div><p>'+p.short+'</p></div><div class="detailgrid">'+p.images.map(im=>'<a href="'+im[2]+'" target="_blank" rel="noopener" title="view image source"><img src="'+im[1]+'" alt="'+im[0]+'" loading="lazy"></a>').join("")+'</div><div class="detailcontent"><div><h2>'+(p.introHeading||"the story behind it")+'</h2>'+section(p.intro,p.introPoints)+'<h2>'+(p.storyHeading||"the detail most people miss")+'</h2>'+section(p.story,p.storyPoints)+'<div class="detailactions">'+p.sources.map(s=>'<a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+' ↗</a>').join("")+'<a href="'+p.map+'" target="_blank" rel="noopener">open map ↗</a></div></div><aside class="facts"><h3>remember this</h3><ul>'+p.facts.map(f=>'<li>'+f+'</li>').join("")+'</ul></aside></div>'}
function showPlace(id,addHistory=true){const p=P.find(x=>x.id===id);if(!p)return;listing.classList.add("hide");detail.classList.add("show");detailbody.innerHTML=detailHTML(p);if(addHistory)history.pushState({place:id},"","#"+id);window.scrollTo({top:0,behavior:"smooth"})}
function back(addHistory=true){detail.classList.remove("show");listing.classList.remove("hide");if(addHistory)history.pushState({},"",location.pathname+location.search);window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("daily").addEventListener("click",e=>{const a=e.target.closest("[data-daily]");if(a){e.preventDefault();showPlace(a.dataset.daily)}});document.getElementById("back").addEventListener("click",()=>back());document.getElementById("homeLogo").addEventListener("click",e=>{e.preventDefault();back()});window.addEventListener("popstate",()=>{const id=location.hash.slice(1);if(id)showPlace(id,false);else back(false)});renderDaily();renderGlobePlaces();renderCollection();drawGlobe();if(location.hash){const p=P.find(x=>x.id===location.hash.slice(1));if(p)showPlace(p.id,false)}
</script>

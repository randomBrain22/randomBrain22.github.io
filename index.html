<!doctype html>

<style>
:root{--ink:#17332c;--muted:#587168;--green:#317b39;--lime:#b9ed69;--glass:rgba(255,255,255,.78);--line:rgba(28,78,59,.15);--sans:'DM Sans',Arial,sans-serif;--serif:'Fraunces',Georgia,serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);background:linear-gradient(180deg,#7ed2f2 0%,#c4eff1 32%,#d9f2bb 63%,#8dd15b 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,input{font:inherit}.shell{width:min(1220px,calc(100% - 48px));margin:auto}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(23,51,44,.18)}.logo{font:600 30px var(--serif);letter-spacing:-.06em}.tagline{font-size:12px;font-weight:700;letter-spacing:.02em;color:#244d4b}
.hero{padding:32px 0 20px}.hero-line{display:flex;align-items:center;justify-content:space-between;gap:18px}.hero-note{font-size:11px;letter-spacing:.14em;text-transform:lowercase;color:#315d53}.hero-mark{font-size:11px;color:#315d53}
.daily{margin:18px 0 34px;display:grid;grid-template-columns:1.1fr .9fr;min-height:330px;background:var(--glass);border:1px solid rgba(255,255,255,.8);border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(35,91,65,.12);backdrop-filter:blur(10px)}.daily-copy{padding:34px 38px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.17em;text-transform:lowercase;color:#397b47}.daily h1{font:600 clamp(34px,5vw,57px)/1.02 var(--serif);letter-spacing:-.045em;margin:13px 0 12px}.daily p{font-size:14px;line-height:1.8;color:#536d62;max-width:500px;margin:0}.daily-meta{font-size:11px;color:#547266;margin-top:17px}.daily-link{display:inline-flex;align-items:center;gap:10px;margin-top:22px;font-size:12px;font-weight:800;color:#245b38}.daily-link span{font-size:20px;transition:transform .2s}.daily-link:hover span{transform:translateX(5px)}.daily-image{min-height:290px;position:relative}.daily-image img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}.daily-image:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.12),transparent 40%)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:28px 0 14px}.section-head h2{font:600 32px var(--serif);letter-spacing:-.035em;margin:0}.section-head p{font-size:11px;color:#486b59;margin:0}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 22px}.search{flex:1;min-width:220px}.search input{width:100%;border:1px solid rgba(38,91,65,.2);background:rgba(255,255,255,.8);border-radius:12px;padding:14px 16px;font-size:13px;outline:none;color:var(--ink)}.search input:focus{border-color:#448f50;box-shadow:0 0 0 3px rgba(91,171,81,.15)}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid rgba(38,91,65,.2);border-radius:99px;padding:10px 15px;background:rgba(255,255,255,.45);color:#365c4b;font-size:11px;cursor:pointer}.filter.active,.filter:hover{background:#347b42;border-color:#347b42;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{cursor:pointer;min-width:0;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.85);border-radius:17px;overflow:hidden;box-shadow:0 9px 25px rgba(35,91,65,.08);transition:transform .22s,box-shadow .22s}.card:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(35,91,65,.15)}.cover{height:220px;overflow:hidden;position:relative;background:#b8d9c1}.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}.card:hover .cover img{transform:scale(1.05)}.placecountry{font-size:10px;letter-spacing:.1em;color:#448052;margin-bottom:7px}.cardbody{padding:17px 18px 16px}.card h3{font:600 23px/1.13 var(--serif);letter-spacing:-.025em;margin:0 0 9px}.card p{font-size:12px;line-height:1.7;color:#63776b;margin:0}.cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:11px;border-top:1px solid var(--line);font-size:10px;color:#46724f}.arrow{font-size:19px}
.pagination{display:flex;justify-content:center;align-items:center;gap:7px;padding:34px 0 60px}.pagebtn{border:1px solid rgba(38,91,65,.2);background:rgba(255,255,255,.55);padding:9px 13px;border-radius:9px;cursor:pointer;font-size:12px;color:var(--ink)}.pagebtn.active,.pagebtn:hover{background:#347b42;border-color:#347b42;color:white}.pagebtn:disabled{opacity:.35;cursor:default}
.detail{display:none;padding:24px 0 75px}.detail.show{display:block}.listing.hide{display:none}.back{border:1px solid rgba(38,91,65,.2);background:rgba(255,255,255,.65);border-radius:99px;padding:10px 15px;color:#326b43;font-size:11px;cursor:pointer;margin:8px 0 24px}.detailhead{display:flex;justify-content:space-between;gap:25px;align-items:end;background:var(--glass);border-radius:18px;padding:26px 30px}.detailhead h1{font:600 clamp(34px,6vw,62px)/1.05 var(--serif);letter-spacing:-.045em;margin:8px 0}.detailhead p{max-width:440px;color:#5a7164;line-height:1.8;font-size:13px;margin:0 0 4px}.detailgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:13px;margin:15px 0 30px}.detailgrid img{width:100%;height:270px;object-fit:cover;display:block;border-radius:14px;background:#c8dfca}.detailgrid a:first-child img{height:100%;min-height:320px}.detailcontent{display:grid;grid-template-columns:1.5fr .8fr;gap:50px;background:var(--glass);border-radius:18px;padding:30px}.detailcontent h2{font:600 27px var(--serif);margin:0 0 10px}.detailcontent p{font-size:13px;line-height:1.9;color:#526c5e;margin:0 0 24px}.facts{padding:20px;background:rgba(198,231,173,.55);border:1px solid rgba(59,120,61,.12);border-radius:14px;align-self:start}.facts h3{font:600 21px var(--serif);margin:0 0 13px}.facts ul{padding-left:17px;margin:0}.facts li{font-size:12px;line-height:1.75;color:#526c5e;margin:0 0 9px}.detailactions{display:flex;gap:15px;flex-wrap:wrap;margin-top:8px}.detailactions a{font-size:11px;color:#28683d;border-bottom:1px solid #8dbb8c;padding-bottom:4px}.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:#587168}footer{border-top:1px solid rgba(23,51,44,.18);padding:22px 0 30px;display:flex;justify-content:space-between;color:#42634e;font-size:10px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.daily{min-height:280px}.daily-copy{padding:26px}.cover{height:200px}.detailcontent{gap:25px}}
@media(max-width:600px){.shell{width:calc(100% - 28px)}.topbar{height:66px}.logo{font-size:27px}.tagline{font-size:10px}.hero{padding-top:22px}.daily{grid-template-columns:1fr;margin-top:12px}.daily-copy{padding:25px 22px}.daily-image{min-height:205px;grid-row:1}.daily h1{font-size:42px}.section-head{align-items:start;flex-direction:column;gap:5px}.section-head h2{font-size:29px}.grid{grid-template-columns:1fr;gap:17px}.cover{height:225px}.toolbar{align-items:stretch}.search{flex-basis:100%}.filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px}.filter{white-space:nowrap}.detailhead{display:block;padding:22px}.detailhead p{margin-top:8px}.detailgrid{grid-template-columns:1fr 1fr;gap:8px}.detailgrid img{height:150px}.detailgrid a:first-child img{min-height:308px}.detailcontent{grid-template-columns:1fr;padding:22px;gap:20px}.facts{order:2}footer{gap:8px;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><a class="logo" href="#" id="homeLogo">places.</a><span class="tagline">procrastinate less, learn more</span></header>
<section class="listing" id="listing">
<div class="hero"><div class="hero-line"><span class="hero-note">a little discovery, every day</span><span class="hero-mark">places to get lost in</span></div></div>
<section class="daily" id="daily"></section>
<div class="section-head"><h2>find your next rabbit hole.</h2><p id="resultNote">browse the collection</p></div>
<div class="toolbar"><label class="search"><input id="search" type="search" placeholder="search places, countries or details..." aria-label="search places"></label><div class="filters" id="filters"><button class="filter active" data-filter="All">all</button><button class="filter" data-filter="Nature">nature</button><button class="filter" data-filter="Culture">culture & history</button><button class="filter" data-filter="Islands">islands</button></div></div>
<div class="grid" id="grid"></div><div class="pagination" id="pagination"></div>
</section>
<section class="detail" id="detail"><button class="back" id="back">← back to all places</button><div id="detailbody"></div></section>
<footer><span>places. · procrastinate less, learn more</span><span>one place at a time</span></footer>
</div>
<script>
const P=[
{id:"plitvice",name:"Plitvice Lakes National Park",country:"Croatia",region:"Central Croatia",type:"natural wonder · national park",tags:["Nature"],short:"The waterfalls are built by living organisms: mosses, algae and bacteria slowly turn dissolved limestone into new rock.",intro:"Plitvice is often photographed as a finished landscape, but it is better understood as a place still being made. Sixteen named lakes spill into one another across a forested karst basin, their edges held by delicate natural dams called tufa barriers.",story:"The unusual detail is that the waterfalls are partly biological architecture. Microscopic algae and bacteria help calcium carbonate crystallise; aquatic mosses then trap and bind the mineral, gradually building porous rock. The park’s own researchers identify the moss Palustriella commutata as an important builder. The barriers grow, erode and redirect water, so the map of the lakes is never completely fixed. Even the brilliant colours are not simply a reflection of the sky: depth, minerals, organisms and light all contribute.",facts:["The park’s tufa barriers are active formations, not ancient stone structures frozen in time.","Mosses can become preserved inside the growing limestone, leaving their shapes behind.","The park protects the wider water catchment because the underground system helps sustain the lakes.","Plitvice became Croatia’s first national park in 1949."],images:[["waterfalls at Plitvice Lakes","https://commons.wikimedia.org/wiki/Special:FilePath/Waterfalls%20at%20Plitvice%20Lakes.jpg?width=1400","https://commons.wikimedia.org/wiki/File:Waterfalls_at_Plitvice_Lakes.jpg"],["lake and waterfalls","https://commons.wikimedia.org/wiki/Special:FilePath/Lake%20with%20a%20row%20of%20waterfalls%2C%20Plitvice%20Lakes%20%28IMG%205311%29.jpg?width=1000","https://commons.wikimedia.org/wiki/File:Lake_with_a_row_of_waterfalls,_Plitvice_Lakes_(IMG_5311).jpg"]],sources:[["unesco world heritage","https://whc.unesco.org/en/list/98/"],["how tufa is formed · Plitvice park","https://np-plitvicka-jezera.hr/en/natural-and-cultural-heritage/natural-heritage/tufa/how-tufa-is-formed/"]],map:"https://www.google.com/maps/search/?api=1&query=Plitvice+Lakes+National+Park+Croatia"},
{id:"ama",name:"Ama Town (海士町)",country:"Japan",region:"Nakanoshima · Oki Islands · Shimane",type:"island town · geology · history",tags:["Islands","Culture"],short:"A farming island inside the collapsed heart of an ancient volcano, where imperial exile, rice fields and red cliffs share the same small landscape.",intro:"Ama Town sits on Nakanoshima, one of the Dōzen islands in the Oki archipelago. Its modest flatlands are unusual in this island group: they gave residents room to grow rice, while the surrounding volcanic coastline rises into red cliffs and sheltered coves.",story:"The Dōzen islands are the exposed rim of a huge volcanic caldera whose centre later collapsed and filled with seawater. At Akiya Coast, oxidised volcanic scoria gives the cliffs their striking red colour. The island’s history is just as unexpected: after the Jōkyū disturbance of 1221, retired Emperor Go-Toba was exiled here and spent the last 19 years of his life on Nakanoshima. Some of his ashes were returned to Kyoto; some remain buried on the island. Ama’s annual Kinnyamonya Festival also gives the wooden rice scoop a starring role, with dancers carrying one in each hand.",facts:["Nakanoshima is the only island in the Dōzen group with enough flatland for substantial rice cultivation.","Akiya Coast’s red cliffs are made from volcanic scoria, deposits of hardened magma coloured by exposure to air.","The Dōzen islands are the rim of a submerged volcanic caldera.","Emperor Go-Toba’s burial site and Oki Shrine are both in Ama Town."],images:[["Akiya Coast, Nakanoshima","https://commons.wikimedia.org/wiki/Special:FilePath/Nakanoshima%20Akiya%20coast.jpg?width=1400","https://commons.wikimedia.org/wiki/File:Nakanoshima_Akiya_coast.jpg"],["Saburo Rocks, Ama","https://commons.wikimedia.org/wiki/Special:FilePath/Ama%20town%20Saburo%20Rocks%20ac.jpg?width=1000","https://commons.wikimedia.org/wiki/Category:Akiya_Coast"]],sources:[["Oki Islands official guide · Ama","https://visit-okiislands.e-oki.net/about/ama/"],["Japan tourism agency · Nakanoshima","https://www.mlit.go.jp/tagengo-db/common/001563181.pdf"],["Akiya Coast guide","https://visit-okiislands.e-oki.net/spots/6066/"]],map:"https://www.google.com/maps/search/?api=1&query=Ama+Town+Nakanoshima+Oki+Islands+Japan"},
{id:"tiantishan",name:"Tiantishan Grottoes (天梯山石窟)",country:"China",region:"Wuwei · Gansu",type:"ancient site · Buddhist art",tags:["Culture"],short:"A fifth-century cave temple that helped shape Buddhist art across China — and whose treasures were split apart by a modern reservoir project.",intro:"Carved into cliffs near Wuwei in Gansu, the Tiantishan Grottoes began under the Northern Liang ruler Juqu Mengxun around 412–439 CE. The site is sometimes called a source of early Chinese cave-temple design because its forms and workshop traditions travelled far beyond this valley.",story:"The caves are more than a collection of statues: they preserve clues to how Buddhist art moved along the Hexi Corridor. The style associated with the site, sometimes called the Liangzhou model, influenced later cave temples including Yungang and Longmen. In 1959–60, construction of the Huangyang River reservoir put parts of the complex at risk. Many sculptures and more than 300 square metres of murals were removed for protection; the monumental Buddha in Cave 13 was too large to move and remained on site. A long conservation effort later repaired and returned many of the displaced works. Some murals were found layered over earlier paintings, revealing centuries of redecoration beneath the visible surface.",facts:["The caves were founded under the Northern Liang ruler Juqu Mengxun in the early fifth century.","The site is regarded as an important origin point for the Liangzhou model of cave-temple art.","Reservoir construction in 1959–60 led to the removal of many murals and sculptures.","A major restoration project repaired more than 300 square metres of murals and over 70 sculptures."],images:[["Tiantishan Grottoes","https://commons.wikimedia.org/wiki/Special:FilePath/Tiantishan%20Grottoes%202015.jpg?width=1400","https://commons.wikimedia.org/wiki/File:Tiantishan_Grottoes_2015.jpg"],["Buddha of Tiantishan","https://commons.wikimedia.org/wiki/Special:FilePath/Tiantishan%20Grotto%20Budda.jpg?width=1000","https://commons.wikimedia.org/wiki/File:Tiantishan_Grotto_Budda.jpg"]],sources:[["Gansu cultural heritage · history and conservation","https://www.gswbj.gov.cn/a/2023/03/27/16793.html"],["China ethnic affairs commission · Northern Liang murals","https://www.neac.gov.cn/seac/c103391/202301/1159968.shtml"]],map:"https://www.google.com/maps/search/?api=1&query=Tiantishan+Grottoes+Wuwei+Gansu+China"},
{id:"debo",name:"Lake Débo (Lac Débo)",country:"Mali",region:"Inner Niger Delta",type:"seasonal lake · wetland · wildlife",tags:["Nature"],short:"A lake that swells and retreats with a flood pulse travelling hundreds of kilometres from rainstorms far upstream.",intro:"Lake Débo lies in the Inner Niger Delta, where the Niger River spreads into a shifting maze of channels, lakes and marshes in central Mali. In this dry part of the Sahel, the delta behaves less like a permanent lake district and more like a vast seasonal breathing system.",story:"The flood does not arrive all at once. Rain falling months earlier in the Niger’s distant headwaters becomes a slow-moving wave that travels downstream. It typically reaches the Lake Débo area around November and December, after passing through the delta’s broad floodplain. During the wet season, water spreads across enormous areas; during the dry season, much of that wetland contracts or dries out. This pulse creates a moving calendar for fish, waterbirds, rice growers and herders. The delta can be mostly dry for nearly half the year, yet when flooded it becomes one of the Sahel’s most productive wetland ecosystems.",facts:["The flood peak at Lake Débo typically arrives in November–December, later than the rains that generated it.","The wider Inner Niger Delta can expand to tens of thousands of square kilometres during high water and shrink dramatically in the dry season.","Flood timing and height depend on rainfall far upstream, not just local weather around the lake.","NASA satellite imagery shows the delta turning intensely green during the annual flood season."],images:[["Lake Débo from space","https://commons.wikimedia.org/wiki/Special:FilePath/ISS-66%20Niger%20River%20leads%20to%20Lake%20Deebo%2C%20Mali.jpg?width=1400","https://commons.wikimedia.org/wiki/Category:Lake_D%C3%A9bo"],["Lake Débo, Landsat view","https://commons.wikimedia.org/wiki/Special:FilePath/Lake%20debo%20mali%20-%20Landsat8%20December%202013.jpg?width=1000","https://commons.wikimedia.org/wiki/Category:Lake_D%C3%A9bo"]],sources:[["nasa earth observatory · seasonal emerald","https://science.nasa.gov/earth/earth-observatory/a-seasonal-emerald-in-the-sahel-149117/"],["freshwater ecoregions · Inner Niger Delta","https://www.feow.org/ecoregions/details/508"]],map:"https://www.google.com/maps/search/?api=1&query=Lake+Debo+Mali"}
];
const grid=document.getElementById("grid"),search=document.getElementById("search"),pagination=document.getElementById("pagination"),listing=document.getElementById("listing"),detail=document.getElementById("detail"),detailbody=document.getElementById("detailbody");let active="All",page=1;const perPage=9;
function dailyIndex(){const d=new Date();const key=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();let x=Math.sin(key*12.9898)*43758.5453;return Math.floor((x-Math.floor(x))*P.length)}
function renderDaily(){const p=P[dailyIndex()];document.getElementById("daily").innerHTML='<div class="daily-copy"><div class="eyebrow">location of the day</div><h1>'+p.name+'</h1><p>'+p.short+'</p><div class="daily-meta">'+p.region+' · '+p.country+'</div><a class="daily-link" href="#'+p.id+'" data-daily="'+p.id+'">explore this place <span>→</span></a></div><a class="daily-image" href="#'+p.id+'" data-daily="'+p.id+'"><img src="'+p.images[0][1]+'" alt="'+p.images[0][0]+'"></a>'}
function card(p){return '<article class="card" data-id="'+p.id+'" tabindex="0" role="link" aria-label="explore '+p.name+'"><div class="cover"><img loading="lazy" src="'+p.images[0][1]+'" alt="'+p.images[0][0]+'"></div><div class="cardbody"><div class="placecountry">'+p.region+' · '+p.country+'</div><h3>'+p.name+'</h3><p>'+p.short+'</p><div class="cardfoot"><span>'+p.type+'</span><span class="arrow">↗</span></div></div></article>'}
function render(){const q=search.value.toLowerCase().trim();const filtered=P.filter(p=>(active==="All"||p.tags.includes(active))&&[p.name,p.country,p.region,p.type,p.short,p.story].join(" ").toLowerCase().includes(q));const pages=Math.max(1,Math.ceil(filtered.length/perPage));page=Math.min(page,pages);document.getElementById("resultNote").textContent=filtered.length+" results";grid.innerHTML=filtered.slice((page-1)*perPage,page*perPage).map(card).join("")||'<div class="empty">no places match your search.</div>';pagination.innerHTML=pages>1?'<button class="pagebtn" data-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>←</button>'+Array.from({length:pages},(_,i)=>'<button class="pagebtn '+(page===i+1?'active':'')+'" data-page="'+(i+1)+'">'+(i+1)+'</button>').join("")+'<button class="pagebtn" data-page="'+(page+1)+'" '+(page===pages?'disabled':'')+'>→</button>':""}
function detailHTML(p){return '<div class="detailhead"><div><div class="eyebrow">'+p.region+' · '+p.country+'</div><h1>'+p.name+'</h1></div><p>'+p.short+'</p></div><div class="detailgrid">'+p.images.map(im=>'<a href="'+im[2]+'" target="_blank" rel="noopener" title="view image source"><img src="'+im[1]+'" alt="'+im[0]+'" loading="lazy"></a>').join("")+'</div><div class="detailcontent"><div><h2>the story behind the place</h2><p>'+p.intro+'</p><h2>what makes it unusual</h2><p>'+p.story+'</p><div class="detailactions">'+p.sources.map(s=>'<a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+' ↗</a>').join("")+'<a href="'+p.map+'" target="_blank" rel="noopener">open map ↗</a></div></div><aside class="facts"><h3>worth knowing</h3><ul>'+p.facts.map(f=>'<li>'+f+'</li>').join("")+'</ul></aside></div>'}
function showPlace(id,addHistory=true){const p=P.find(x=>x.id===id);if(!p)return;listing.classList.add("hide");detail.classList.add("show");detailbody.innerHTML=detailHTML(p);if(addHistory)history.pushState({place:id},"","#"+id);window.scrollTo({top:0,behavior:"smooth"})}
function back(addHistory=true){detail.classList.remove("show");listing.classList.remove("hide");if(addHistory)history.pushState({},"",location.pathname+location.search);window.scrollTo({top:0,behavior:"smooth"})}
grid.addEventListener("click",e=>{const c=e.target.closest(".card");if(c)showPlace(c.dataset.id)});grid.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".card")){e.preventDefault();showPlace(e.target.dataset.id)}});document.getElementById("daily").addEventListener("click",e=>{const a=e.target.closest("[data-daily]");if(a){e.preventDefault();showPlace(a.dataset.daily)}});pagination.addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b&&!b.disabled){page=Number(b.dataset.page);render();window.scrollTo({top:document.querySelector(".toolbar").offsetTop-20,behavior:"smooth"})}});search.addEventListener("input",()=>{page=1;render()});document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;active=b.dataset.filter;page=1;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});document.getElementById("back").addEventListener("click",()=>back());document.getElementById("homeLogo").addEventListener("click",e=>{e.preventDefault();back()});window.addEventListener("popstate",()=>{const id=location.hash.slice(1);if(id)showPlace(id,false);else back(false)});renderDaily();render();if(location.hash){const p=P.find(x=>x.id===location.hash.slice(1));if(p)showPlace(p.id,false)}
</script>
</body>
</html>

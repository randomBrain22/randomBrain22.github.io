<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A simple, growing collection of interesting places around the world.">
<meta name="theme-color" content="#ffffff">
<title>Places</title>
<style>
:root{--ink:#202124;--muted:#666b73;--line:#e6e8eb;--soft:#f6f7f8;--link:#315f91;--max:900px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(var(--max),calc(100% - 40px));margin:0 auto}
header{padding:48px 0 28px;border-bottom:1px solid var(--line)}
h1{font-size:32px;line-height:1.2;letter-spacing:-.04em;margin:0 0 8px;font-weight:650}
header p{margin:0;color:var(--muted);font-size:15px}
.controls{display:flex;gap:10px;margin:24px 0 8px;flex-wrap:wrap}
input,select{font:inherit;font-size:14px;padding:11px 13px;border:1px solid #d9dde2;border-radius:7px;background:#fff;color:var(--ink)}
input{flex:1;min-width:200px}select{min-width:155px}
.count{font-size:12px;color:var(--muted);margin:16px 0}
.place{padding:25px 0 27px;border-bottom:1px solid var(--line)}
.place-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.place h2{font-size:21px;line-height:1.3;margin:0;font-weight:620;letter-spacing:-.02em}
.country{font-size:12px;color:var(--muted);white-space:nowrap}
.summary{font-size:15px;margin:10px 0 14px;max-width:760px}
.detail{font-size:13px;color:#4f555d;margin:5px 0}
.detail strong{color:#30343a;font-weight:600}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
footer{padding:28px 0 45px;color:#8a8f97;font-size:12px}
.empty{padding:32px 0;color:var(--muted);font-size:14px}
@media(max-width:560px){main{width:calc(100% - 32px)}header{padding-top:35px}.place-top{display:block}.country{display:block;margin-top:4px}.controls{display:grid;grid-template-columns:1fr}input,select{width:100%}}
</style>
</head>
<body>
<main>
<header>
<h1>Places</h1>
<p>A growing collection of interesting places around the world.</p>
<div class="controls">
<input id="search" type="search" placeholder="Search places or countries…" aria-label="Search places">
<select id="country" aria-label="Filter by country"><option value="">All countries</option></select>
</div>
<div class="count" id="count" aria-live="polite"></div>
</header>
<section id="places" aria-label="Places"></section>
<footer>Simple notes on places, landscapes, history and culture.</footer>
</main>
<script>
const places = [
{
 name:"Plitvice Lakes National Park",
 country:"Croatia",
 type:"Nature · National park",
 summary:"A forested lake system in central Croatia, known for clear, changing-colour waters and waterfalls linking a chain of lakes.",
 why:"Water flowing over limestone and chalk gradually builds natural travertine barriers. These dams create the lakes and cascades, and the process is still continuing.",
 facts:["The park was established in 1949 as Croatia’s first national park.","The lake system has 16 named lakes, grouped into the Upper and Lower Lakes.","Inscribed on the UNESCO World Heritage List in 1979."],
 sources:[["Official park","https://np-plitvicka-jezera.hr/en/about-the-park/general-information/"],["UNESCO","https://whc.unesco.org/en/list/98"]],
 map:"https://www.google.com/maps/search/?api=1&query=Plitvice+Lakes+National+Park+Croatia"
},
{
 name:"Ama Town (海士町)",
 country:"Japan · Shimane",
 type:"Island town · Culture · Nature",
 summary:"A small island town on Nakanoshima in the Oki Islands, in the Sea of Japan. It combines a rural island landscape with a strong local history and community identity.",
 why:"Ama is closely associated with the exile of retired Emperor Go-Toba in the 13th century. The island is also known for its coastline, fishing and farming, and its place within the Oki Islands UNESCO Global Geopark.",
 facts:["Located on Nakanoshima Island, one of the Dōzen Islands.","Oki Shrine is dedicated to Emperor Go-Toba.","Akiya Coast is one of the island’s notable natural sights."],
 sources:[["Official Oki Islands guide","https://visit-okiislands.e-oki.net/about/ama/"],["Shimane tourism guide","https://www.kankou-shimane.com/en/activities_city/ama"]],
 map:"https://www.google.com/maps/search/?api=1&query=Ama+Town+Nakanoshima+Oki+Islands+Japan"
},
{
 name:"Tiantishan Grottoes (天梯山石窟)",
 country:"China · Gansu",
 type:"Heritage · Buddhist grottoes",
 summary:"An early Buddhist cave complex near Wuwei in Gansu Province, set into a mountain landscape beside a reservoir.",
 why:"The grottoes were begun during the Northern Liang period, more than 1,600 years ago, and are regarded as an important early centre in the development of Chinese cave-temple art.",
 facts:["Also known as Liangzhou Grottoes.","The best-known Cave 13 contains a monumental seated Buddha reported at about 28 metres high.","The site preserves Buddhist sculpture and mural-painting traditions from several historical periods."],
 sources:[["Gansu cultural heritage feature","https://www.gswbj.gov.cn/a/2025/08/27/25711.html"],["Wuwei cultural tourism feature","https://m.thepaper.cn/newsDetail_forward_23202335"]],
 map:"https://www.google.com/maps/search/?api=1&query=Tiantishan+Grottoes+Wuwei+Gansu+China"
},
{
 name:"Lake Débo (Lac Débo)",
 country:"Mali",
 type:"Lake · Wetland · Wildlife",
 summary:"A shallow lake in the central part of Mali’s Inner Niger Delta, within a vast landscape of river channels, floodplains, marshes and seasonal lakes.",
 why:"Its size and surrounding wetlands change with the annual flood pulse of the Niger and Bani rivers. The lake and nearby wetlands support fishing, grazing, farming and large gatherings of waterbirds.",
 facts:["The lake lies near the centre of the Inner Niger Delta.","Floodwaters typically arrive after the rainy season upstream; water levels and flooded area vary greatly from year to year.","The delta is an important wetland ecosystem in the Sahel."],
 sources:[["Mali Biodiversity Clearing-House","https://ml.chm-cbd.net/en/inner-niger-delta"],["Freshwater Ecoregions of the World","https://www.feow.org/ecoregions/details/508"]],
 map:"https://www.google.com/maps/search/?api=1&query=Lake+Debo+Mali"
}
];
const placesEl=document.getElementById("places"), searchEl=document.getElementById("search"), countryEl=document.getElementById("country"), countEl=document.getElementById("count");
[...new Set(places.map(p=>p.country))].forEach(country=>{const o=document.createElement("option");o.value=country;o.textContent=country;countryEl.append(o)});
function render(){
 const q=searchEl.value.trim().toLowerCase(), c=countryEl.value;
 const filtered=places.filter(p=>(!c||p.country===c)&&[p.name,p.country,p.type,p.summary,p.why].join(" ").toLowerCase().includes(q));
 countEl.textContent=filtered.length+" "+(filtered.length===1?"place":"places");
 placesEl.replaceChildren();
 if(!filtered.length){const e=document.createElement("p");e.className="empty";e.textContent="No places found.";placesEl.append(e);return}
 filtered.forEach(p=>{
  const article=document.createElement("article");article.className="place";
  const top=document.createElement("div");top.className="place-top";
  const h=document.createElement("h2");h.textContent=p.name;
  const country=document.createElement("span");country.className="country";country.textContent=p.country;
  top.append(h,country);article.append(top);
  const type=document.createElement("div");type.className="detail";type.textContent=p.type;article.append(type);
  const summary=document.createElement("p");summary.className="summary";summary.textContent=p.summary;article.append(summary);
  const why=document.createElement("p");why.className="detail";const strong=document.createElement("strong");strong.textContent="What makes it interesting: ";why.append(strong,document.createTextNode(p.why));article.append(why);
  const facts=document.createElement("div");facts.className="detail";const label=document.createElement("strong");label.textContent="Key facts";facts.append(label);
  const ul=document.createElement("ul");ul.style.cssText="margin:5px 0 0;padding-left:20px;color:#4f555d;font-size:13px";
  p.facts.forEach(f=>{const li=document.createElement("li");li.textContent=f;ul.append(li)});facts.append(ul);article.append(facts);
  const links=document.createElement("div");links.className="links";
  p.sources.forEach(([name,url])=>{const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Source: "+name;links.append(a)});
  const map=document.createElement("a");map.href=p.map;map.target="_blank";map.rel="noopener noreferrer";map.textContent="Map ↗";links.append(map);article.append(links);
  placesEl.append(article);
 });
}
searchEl.addEventListener("input",render);countryEl.addEventListener("change",render);render();
</script>
</body></html>
